<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeBase - Browse Pokemon Card Collections | Track & Share Your Collection</title>
    <meta name="description" content="Discover and explore public Pokemon card collections from collectors worldwide. Track your own collection, get auto-detected market prices, and share with the community.">
    <meta name="keywords" content="pokemon cards, card collection, pokemon tcg, card tracker, pokemon collection, pokebase, card database, pokemon market prices">
    <meta name="robots" content="index, follow">
    <meta name="author" content="PokeBase">
    <link rel="canonical" href="https://pokebase.online/">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="PokeBase - Browse Pokemon Card Collections">
    <meta property="og:description" content="Discover and explore public Pokemon card collections from collectors worldwide. Track your own collection and share with the community.">
    <meta property="og:url" content="https://pokebase.online/">
    <meta property="og:site_name" content="PokeBase">
    <meta property="og:image" content="https://pokebase.online/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="PokeBase - Browse Pokemon Card Collections">
    <meta name="twitter:description" content="Discover and explore public Pokemon card collections from collectors worldwide.">
    <meta name="twitter:image" content="https://pokebase.online/og-image.png">

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "PokeBase",
        "url": "https://pokebase.online",
        "description": "Pokemon card collection tracker with social sharing. Track, organize, and share your Pokemon card collection.",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Web",
        "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
        },
        "featureList": [
            "Auto-detect Pokemon cards by collector number",
            "Track collection value with market prices",
            "Share collections publicly",
            "Rate and like other collections",
            "Chat with other collectors"
        ]
    }
    </script>

    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar" role="navigation" aria-label="Main navigation">
        <div class="container">
            <a href="/" class="navbar-brand" aria-label="PokeBase Home">Poke<span>Base</span></a>
            <div class="navbar-links" id="nav-links"></div>
        </div>
    </nav>

    <main class="container" role="main">
        <header class="dashboard-header">
            <h1>Explore Pokemon Card Collections</h1>
            <p>Browse public Pokemon card collections from collectors around the world</p>
        </header>

        <section aria-label="Search and filter collections">
            <div class="toolbar">
                <div class="search-box">
                    <input type="text" id="home-search" placeholder="Search by username..." onkeydown="if(event.key==='Enter')searchHomeFeed()" aria-label="Search collections by username">
                    <button class="btn btn-secondary btn-small" onclick="searchHomeFeed()">Search</button>
                    <button class="btn btn-secondary btn-small" id="trending-btn" onclick="toggleTrending()">Trending</button>
                </div>
            </div>
        </section>

        <section aria-label="Public collections">
            <div class="card-grid home-grid" id="home-grid"></div>
            <nav class="pagination" id="pagination" aria-label="Pagination"></nav>
        </section>

        <div class="empty-state" id="empty-state" style="display:none;">
            <h2>No public collections yet</h2>
            <p>Be the first to share your Pokemon card collection with the world!</p>
            <a href="/signup.html" class="btn btn-primary">Sign Up Free</a>
        </div>
    </main>

    <footer role="contentinfo" style="text-align:center;padding:40px 20px;color:var(--text-dim);font-size:0.85rem;">
        <p>PokeBase - Free Pokemon Card Collection Tracker & Social Platform</p>
    </footer>

    <div class="toast" id="toast" role="alert" aria-live="polite"></div>

    <script src="/js/auth.js"></script>
    <script src="/js/app.js"></script>
    <script>
        updateNav();
        loadHomeFeed();
    </script>
</body>
</html>
