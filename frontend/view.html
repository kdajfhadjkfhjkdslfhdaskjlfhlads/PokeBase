<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared Pokemon Collection - PokeBase</title>
    <meta name="description" id="meta-description" content="View this shared Pokemon card collection on PokeBase. See cards, market values, and collection stats.">
    <meta name="keywords" content="pokemon card collection, shared collection, pokemon tcg, pokebase">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://pokebase.online/view.html">

    <!-- Open Graph (dynamically updated) -->
    <meta property="og:type" content="profile">
    <meta property="og:title" id="og-title" content="Shared Pokemon Collection - PokeBase">
    <meta property="og:description" id="og-description" content="View this shared Pokemon card collection on PokeBase.">
    <meta property="og:url" content="https://pokebase.online/view.html">
    <meta property="og:site_name" content="PokeBase">
    <meta property="og:image" content="https://pokebase.online/og-image.png">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" id="tw-title" content="Shared Pokemon Collection - PokeBase">
    <meta name="twitter:description" id="tw-description" content="View this shared Pokemon card collection on PokeBase.">

    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar" role="navigation" aria-label="Main navigation">
        <div class="container">
            <a href="/" class="navbar-brand" aria-label="PokeBase Home">Poke<span>Base</span></a>
            <div class="navbar-links" id="nav-links"></div>
        </div>
    </nav>

    <main class="container" role="main">
        <header class="share-header">
            <h1 id="share-username">'s Collection</h1>
            <p id="share-subtitle"></p>
        </header>

        <section aria-label="Collection statistics">
            <div class="stats-row">
                <div class="stat-card">
                    <div class="stat-value" id="share-total">0</div>
                    <div class="stat-label">Total Cards</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="share-value">$0</div>
                    <div class="stat-label">Collection Value</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="share-unique">0</div>
                    <div class="stat-label">Unique Pokemon</div>
                </div>
            </div>
        </section>

        <section aria-label="Collection cards">
            <div class="card-grid" id="share-card-grid"></div>
            <div class="empty-state" id="empty-state" style="display:none;">
                <h2>No cards in this collection</h2>
            </div>
        </section>
    </main>

    <div class="toast" id="toast" role="alert" aria-live="polite"></div>

    <script src="/js/auth.js"></script>
    <script src="/js/app.js"></script>
    <script>
        updateNav();
        loadSharedCollection();
    </script>
</body>
</html>
