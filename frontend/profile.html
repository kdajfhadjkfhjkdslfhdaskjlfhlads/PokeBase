<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Card Collection - PokeBase</title>
    <meta name="description" id="meta-description" content="View this Pokemon card collection on PokeBase. Browse cards, check market values, and rate the collection.">
    <meta name="keywords" content="pokemon card collection, pokemon tcg, card collection viewer, pokebase collection">
    <meta name="robots" content="index, follow">
    <link rel="canonical" id="canonical-url" href="https://pokebase.online/profile.html">

    <!-- Open Graph (dynamically updated) -->
    <meta property="og:type" content="profile">
    <meta property="og:title" id="og-title" content="Pokemon Card Collection - PokeBase">
    <meta property="og:description" id="og-description" content="View this Pokemon card collection on PokeBase.">
    <meta property="og:url" id="og-url" content="https://pokebase.online/profile.html">
    <meta property="og:site_name" content="PokeBase">
    <meta property="og:image" content="https://pokebase.online/og-image.png">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" id="tw-title" content="Pokemon Card Collection - PokeBase">
    <meta name="twitter:description" id="tw-description" content="View this Pokemon card collection on PokeBase.">

    <!-- Structured Data (dynamically updated) -->
    <script type="application/ld+json" id="structured-data">
    {
        "@context": "https://schema.org",
        "@type": "CollectionPage",
        "name": "Pokemon Card Collection",
        "description": "View this Pokemon card collection on PokeBase",
        "isPartOf": {
            "@type": "WebSite",
            "name": "PokeBase",
            "url": "https://pokebase.online"
        }
    }
    </script>

    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar" role="navigation" aria-label="Main navigation">
        <div class="container">
            <a href="/" class="navbar-brand" aria-label="PokeBase Home">Poke<span>Base</span></a>
            <div class="navbar-links" id="nav-links"></div>
        </div>
    </nav>

    <main class="container" id="profile-content" role="main">
        <header class="share-header">
            <h1 id="profile-username">'s Collection</h1>
            <div class="profile-actions" id="profile-actions" style="display:none;">
                <button class="btn btn-primary btn-small" id="chat-btn">Message</button>
                <button class="btn btn-danger btn-small" id="report-btn">Report</button>
            </div>
        </header>

        <section aria-label="Collection statistics">
            <div class="stats-row">
                <div class="stat-card">
                    <div class="stat-value" id="profile-total">0</div>
                    <div class="stat-label">Total Cards</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="profile-value">$0</div>
                    <div class="stat-label">Collection Value</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="profile-unique">0</div>
                    <div class="stat-label">Unique Pokemon</div>
                </div>
            </div>
        </section>

        <section aria-label="Rate this collection">
            <div class="rating-section">
                <div class="rating-area">
                    <div class="rating-stars" id="rating-stars" role="img" aria-label="Rating stars"></div>
                    <div class="rating-info" id="rating-average">0 (0 ratings)</div>
                </div>
                <button class="btn btn-secondary btn-small like-btn" id="like-btn" onclick="toggleLikeProfile()">0</button>
            </div>
        </section>

        <section aria-label="Collection cards">
            <div class="card-grid" id="profile-card-grid"></div>
            <div class="empty-state" id="profile-empty" style="display:none;">
                <h2>No cards yet</h2>
                <p>This collection is empty.</p>
            </div>
        </section>
    </main>

    <div class="toast" id="toast" role="alert" aria-live="polite"></div>

    <script src="/js/auth.js"></script>
    <script src="/js/app.js"></script>
    <script>
        renderReportModal();
        updateNav();
        loadProfile();
    </script>
</body>
</html>
